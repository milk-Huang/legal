<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协议与政策</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --rule: #e3e3e6;
    --accent: #5E5CE6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11;
      --fg: #ececef;
      --muted: #9a9aa0;
      --rule: #2b2b30;
      --accent: #8b89f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .4rem; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0 0 2.5rem; font-size: .9375rem; }
  h2 {
    font-size: .8125rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
    margin: 2.5rem 0 .5rem;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  a {
    display: block; padding: .85rem 0;
    color: var(--fg); text-decoration: none;
  }
  a:hover { color: var(--accent); }
  a span { color: var(--muted); font-size: .875rem; display: block; }
</style>
</head>
<body>
<main>
  <h1>协议与支持</h1>
  <p class="lead">各项目对外发布的协议、政策与支持页面。</p>

  <h2>LinkReader</h2>
  <ul>
    <li>
      <a href="linkreader/privacy.html">
        隐私政策
        <span>本地优先，不收集数据。中文 / English</span>
      </a>
    </li>
    <li>
      <a href="linkreader/support.html">
        帮助与反馈
        <span>常见问题与问题反馈渠道。中文 / English</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
